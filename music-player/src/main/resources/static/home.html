<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<style>
    #toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #8e44ad;
    color: white;
    padding: 12px 24px;
    border-radius: 999px;
    font-weight: 600;
    z-index: 2000;
    transition: 0.4s;
    opacity: 0;
}

#toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
}
</style>

<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="aurora">
            <div class="aurora__item"></div>
            <div class="aurora__item"></div>
            <div class="aurora__item"></div>
            <div class="aurora__item"></div>
        </div>
        <div class="brand">
            <div class="brand-title">
                <span class="brand-icon">♫</span>
                My Library
            </div>
            <div class="welcome-text">Welcome back, <span id="username-display">—</span></div>
        </div>
        <div class="nav-actions">
            <button class="nav-btn browse" onclick="window.location.href='songs.html'">🎶 Browse Songs</button>
            <button class="nav-btn profile" onclick="goToProfile()">👤 Profile</button>
            <button class="nav-btn logout" onclick="logout()">↩ Logout</button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content">
        <div class="search-row">
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="search" placeholder="Search by title, artist, genre, mood…"
                    oninput="searchLibrary()">
            </div>
        </div>
        <div class="section-header">
            <h3>Saved Songs</h3>
            <span class="favCount" id="fav-count">— favorites</span>
        </div>
        <div id="library">
            <p class="state-msg">Loading…</p>
        </div>
    </div>

    <!-- MINI PLAYER BAR -->
    <div id="mini-player">
        <div id="mp-art-wrap">
            <div class="mp-art-placeholder">🎵</div>
        </div>
        <div class="mp-info">
            <div class="mp-title" id="mp-title">—</div>
            <div class="mp-artist" id="mp-artist">—</div>
        </div>
        <div class="mp-controls">
            <button class="mp-btn play-pause" id="mp-playpause" onclick="togglePlayerPlayPause()">▶</button>
        </div>
        <div class="mp-progress-area">
            <div class="mp-progress-track" id="mp-track" onclick="seekTo(event)">
                <div class="mp-progress-fill" id="mp-fill"></div>
            </div>
            <div class="mp-times">
                <span id="mp-current">0:00</span>
                <span id="mp-total">0:00</span>
            </div>
        </div>
        <div class="mp-volume">
            <span class="mp-vol-icon" onclick="toggleMute()">🔊</span>
            <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)">
        </div>
    </div>

    <script>
        /* ── state ── */
        const player = new Audio();
        let currentPlayingTitle = null;
        let currentPlayingSong = null;
        let isMuted = false;

        const currentUser = localStorage.getItem("currentUser");
        if (!currentUser) window.location.href = "index.html";
        document.getElementById("username-display").textContent = currentUser || "there";

        window.onload = loadLibrary;

        /* ── format seconds → m:ss ── */
        function fmt(s) {
            if (!isFinite(s) || isNaN(s)) return "—";
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60).toString().padStart(2, "0");
            return `${m}:${sec}`;
        }

        /* ── build card HTML ── */
        function buildCard(song) {
            const genre = song.genre || "";
            const mood = song.mood || "";
            const safeTitle = song.title.replace(/'/g, "\\'");
            return `
                <div class="song" id="card-${song.id}" data-title="${song.title}">
                    <div class="card-img-wrap">
                        <button class="fav-btn" onclick="toggleFavorite('${song.id}', this)">💜</button>
                        <div class="card-overlay">
                            <button class="card-play-btn" onclick="playCard('${song.id}','${safeTitle}')">▶</button>
                        </div>
                        <span class="duration-badge" id="dur-${song.id}">—</span>
                        ${song.imageUrl
                    ? `<img src="${song.imageUrl}" alt="${song.title}">`
                    : `<div class="no-image">🎵</div>`}
                    </div>
                    <div class="song-info">
                        <strong>${song.title}</strong>
                        <span class="artist">${song.artist}</span>
                        <div class="song-tags">
                            ${genre ? `<span class="tag">${genre}</span>` : ''}
                            ${mood ? `<span class="tag">${mood}</span>` : ''}
                        </div>
                    </div>
                </div>`;
        }

        /* ── pre-load durations for all cards ── */
        function loadDurations(songs) {
            songs.forEach(song => {
                const probe = new Audio(`audio/${song.title}.mp3`);
                probe.preload = "metadata";
                probe.addEventListener("loadedmetadata", () => {
                    const el = document.getElementById(`dur-${song.id}`);
                    if (el) el.textContent = fmt(probe.duration);
                });
            });
        }

        /* ── load library ── */
        let allFavorites = [];

        function renderCards(songs) {
            const libraryDiv = document.getElementById("library");
            if (!songs || songs.length === 0) {
                libraryDiv.innerHTML = '<p class="state-msg">No saved songs yet — go browse and add some! 🎵</p>';
                return;
            }
            libraryDiv.innerHTML = songs.map(buildCard).join("");
            loadDurations(songs);
            // re-apply playing state if still playing
            if (currentPlayingTitle) refreshPlayingState();
        }

        function loadLibrary() {
            document.getElementById("library").innerHTML = '<p class="state-msg">Loading…</p>';
            fetch(`http://localhost:8080/api/songs/favorites/${currentUser}`)
                .then(r => r.json())
                .then(data => {
                    allFavorites = data;
                    document.getElementById("fav-count").textContent =
                        `${data.length} favorite${data.length !== 1 ? 's' : ''}`;
                    renderCards(data);
                })
                .catch(() => {
                    document.getElementById("library").innerHTML =
                        '<p class="state-msg">Failed to load songs. Is the server running?</p>';
                });
        }

        /* ── search ── */
        function searchLibrary() {
            const q = document.getElementById("search").value.toLowerCase().trim();
            if (!q) { renderCards(allFavorites); return; }
            const filtered = allFavorites.filter(s =>
                (s.title || "").toLowerCase().includes(q) ||
                (s.artist || "").toLowerCase().includes(q) ||
                (s.genre || "").toLowerCase().includes(q) ||
                (s.mood || "").toLowerCase().includes(q)
            );
            renderCards(filtered);
        }

        /* ── play a card ── */
        function playCard(songId, songTitle) {
            // toggle pause if same song
            if (currentPlayingTitle === songTitle) {
                togglePlayerPlayPause();
                return;
            }

            // find the song object so we can show artist / art in mini player
            const song = allFavorites.find(s => s.title === songTitle) || { title: songTitle, artist: "" };
            currentPlayingSong = song;

            // update audio
            player.src = `audio/${songTitle}.mp3`;
            player.play().catch(() => alert("Audio file not found: " + songTitle + ".mp3"));
            currentPlayingTitle = songTitle;

            // update mini-player info
            document.getElementById("mp-title").textContent = song.title;
            document.getElementById("mp-artist").textContent = song.artist || "";
            const artWrap = document.getElementById("mp-art-wrap");
            artWrap.innerHTML = song.imageUrl
                ? `<img class="mp-art" src="${song.imageUrl}" alt="${song.title}">`
                : `<div class="mp-art-placeholder">🎵</div>`;

            document.getElementById("mini-player").classList.add("visible");
            refreshPlayingState();
        }

        /* ── mark active card, update button icons ── */
        function refreshPlayingState() {
            document.querySelectorAll(".song").forEach(card => {
                const isThis = card.dataset.title === currentPlayingTitle;
                card.classList.toggle("is-playing", isThis && !player.paused);
                const btn = card.querySelector(".card-play-btn");
                if (btn) btn.textContent = (isThis && !player.paused) ? "⏸" : "▶";
            });
            document.getElementById("mp-playpause").textContent = player.paused ? "▶" : "⏸";
        }

        /* ── toggle from mini player ── */
        function togglePlayerPlayPause() {
            if (!currentPlayingTitle) return;
            if (player.paused) { player.play(); } else { player.pause(); }
        }

        /* ── audio events ── */
        player.addEventListener("play", refreshPlayingState);
        player.addEventListener("pause", refreshPlayingState);
        player.addEventListener("ended", () => {
            currentPlayingTitle = null;
            refreshPlayingState();
            document.getElementById("mp-fill").style.width = "0%";
            document.getElementById("mp-current").textContent = "0:00";
        });

        player.addEventListener("loadedmetadata", () => {
            document.getElementById("mp-total").textContent = fmt(player.duration);
        });

        player.addEventListener("timeupdate", () => {
            if (!player.duration) return;
            const pct = (player.currentTime / player.duration) * 100;
            document.getElementById("mp-fill").style.width = pct + "%";
            document.getElementById("mp-current").textContent = fmt(player.currentTime);
        });

        /* ── seek ── */
        function seekTo(e) {
            if (!player.duration) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            player.currentTime = pct * player.duration;
        }

        /* ── volume ── */
        function setVolume(v) {
            player.volume = v;
            isMuted = (v == 0);
        }
        function toggleMute() {
            isMuted = !isMuted;
            player.muted = isMuted;
            document.querySelector(".mp-vol-icon").textContent = isMuted ? "🔇" : "🔊";
        }

        /* ── toggle favorite ── */
        async function toggleFavorite(songId, btn) {
    try {
        // 1. Tell the server
        await fetch(`http://localhost:8080/api/users/${currentUser}/favorites/${songId}?isFavorite=false`, {
            method: "PATCH"
        });

        // 2. Show the toast immediately
        showToast("Removed from Favorites 🤍");

        // 3. Instead of loadLibrary(), just hide the card and update the local data
        const card = document.getElementById(`card-${songId}`);
        if (card) {
            card.style.opacity = '0';
            card.style.transform = 'scale(0.8)';
            card.style.transition = '0.3s';
            
            setTimeout(() => {
                card.remove(); // Remove it from the DOM
                // Update the array so search still works correctly
                allFavorites = allFavorites.filter(s => s.id != songId);
                // Update the count text
                document.getElementById("fav-count").textContent =
                    `${allFavorites.length} favorite${allFavorites.length !== 1 ? 's' : ''}`;
                
                if (allFavorites.length === 0) {
                    document.getElementById("library").innerHTML = 
                        '<p class="state-msg">No saved songs yet — go browse and add some! 🎵</p>';
                }
            }, 300);
        }
    } catch (err) {
        showToast("Could not update favorite ❌");
    }
}

        let toastTimer; // Global variable to track the timer

function showToast(msg) {
    const t = document.getElementById("toast");
    if (!t) return;

    // Clear any existing timer so they don't overlap
    clearTimeout(toastTimer);

    t.textContent = msg;
    t.classList.add("show");

    // Hide it after 3 seconds
    toastTimer = setTimeout(() => {
        t.classList.remove("show");
    }, 3000);
}

        /* ── nav ── */
        function goToProfile() { window.location.href = "profile.html"; }
        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "http://localhost:8080/index.html";
        }
    </script>
    <div id="toast"></div>
</body>

</html>
