<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Toast popup message */
        #toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #8e44ad;
            color: white;
            padding: 12px 24px;
            border-radius: 999px;
            font-weight: 600;
            z-index: 2000;
            transition: 0.4s;
            opacity: 0;
        }

        /* When show is added, makes the toast visible */
        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Tab container for the favorites and playlists */
        .tab-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 28px;
        }

        /* Individual tab button */
        .tab-btn {
            padding: 10px 24px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-2);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Hovering over the tab button */
        .tab-btn:hover {
            border-color: var(--border2);
            color: var(--text);
        }

        /* Active styling for the tab */
        .tab-btn.active {
            background: var(--purple);
            border-color: var(--purple);
            color: #fff;
        }

        /* The playlist card */
        #playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 18px;
        }

        .playlist-card {
            background: var(--surface);
            border-radius: 14px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .playlist-card:hover {
            transform: translateY(-3px);
            border-color: var(--border2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }

        /* Showing the albumn covers on the playlists in a mosaic layout */
        .playlist-card-art {
            aspect-ratio: 1/1;
            position: relative;
            background: linear-gradient(135deg, #1e1a30, #372554);
            overflow: hidden;
            flex-shrink: 0;
        }

        .mosaic-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: 100%;
            height: 100%;
        }

        .mosaic-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* For when there's no albumn art to display */
        .mosaic-grid .mosaic-empty {
            background: linear-gradient(135deg, #2a2040, #1a1030);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            opacity: 0.4;
        }

        /* For when there's a single album so it fills the entire card */
        .mosaic-single {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .mosaic-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 54px;
            opacity: 0.5;
        }

        /* Overlay + play btn on the playlist card */
        .playlist-card-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            transition: background 0.2s;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 12px;
            z-index: 5;
        }

        .playlist-card:hover .playlist-card-overlay {
            background: rgba(0, 0, 0, 0.38);
        }

        .playlist-play-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: #fff;
            color: #000;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            transition: background 0.15s, transform 0.15s, opacity 0.2s;
            opacity: 0;
            transform: translateY(4px) scale(0.9);
            flex-shrink: 0;
        }

        .playlist-card:hover .playlist-play-btn {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .playlist-play-btn:hover {
            transform: scale(1.08) !important;
            background: var(--purple-lt);
        }

        .song-count-badge {
            position: absolute;
            bottom: 10px;
            left: 12px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            border-radius: 6px;
            padding: 3px 7px;
            z-index: 6;
        }

        /* To show if private */
        .privacy-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .badge-private {
            background: #444;
            color: #ff4d4d;
            border: 1px solid #ff4d4d33;
        }

        /* To show if it's public */
        .badge-public {
            background: #444;
            color: #4ade80;
            border: 1px solid #4ade8033;
        }

        .playlist-card-info {
            padding: 13px 15px 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .playlist-card-info strong {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-card-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* Drill in to see more info */
        .drill-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .back-btn {
            padding: 9px 18px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-2);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .back-btn:hover {
            background: var(--surface2);
            color: var(--text);
        }

        .drill-title {
            font-size: 20px;
            font-weight: 700;
        }

        .drill-subtitle {
            font-size: 13px;
            color: var(--text-2);
            margin-top: 2px;
        }

        .drill-play-all {
            margin-left: auto;
            padding: 9px 20px;
            border-radius: 999px;
            border: none;
            background: var(--purple);
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .drill-play-all:hover {
            background: var(--purple-lt);
            color: #000;
        }
    </style>
</head>

<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="aurora">
            <!-- Creates the moving blobs -->
            <div class="aurora__item"></div>
            <div class="aurora__item"></div>
            <div class="aurora__item"></div>
            <div class="aurora__item"></div>
        </div>
        <!-- For the logo and title -->
        <div class="brand">
            <div class="brand-title">
                <span class="brand-icon">♫</span>
                My Library
            </div>
            <!-- Includes the username of the user -->
            <div class="welcome-text">Welcome back, <span id="username-display">—</span></div>
        </div>
        <!-- Navigation buttons -->
        <div class="nav-actions">
            <!-- Going to browse songs page -->
            <button class="nav-btn browse" onclick="window.location.href='songs.html'">🎶 Browse Songs</button>
            <!-- Going to profile page -->
            <button class="nav-btn profile" onclick="goToProfile()">👤 Profile</button>
            <!-- Logging out -->
            <button class="nav-btn logout" onclick="logout()">↩ Logout</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content">
        <!-- Search bar -->
        <div class="search-row">
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="search" placeholder="Search by title, artist, genre, mood…" oninput="onSearch()">
            </div>
        </div>

        <!-- Tab bar buttons -->
        <div class="tab-bar">
            <button class="tab-btn active" id="tab-favs" onclick="switchTab('favorites')">💜 Favorites</button>
            <button class="tab-btn" id="tab-playlists" onclick="switchTab('playlists')">🎶 Playlists</button>
        </div>

        <!-- Favorites view -->
        <div id="view-favorites">
            <div class="section-header">
                <h3>Saved Songs</h3>
                <span class="favCount" id="fav-count">— favorites</span>
            </div>
            <div id="library">
                <!-- Shows the favorited songs -->
                <p class="state-msg">Loading…</p>
            </div>
        </div>

        <!-- Playlists section -->
        <div id="view-playlists" style="display:none;">

            <!-- Playlist grid -->
            <div id="playlist-grid-view">
                <div class="section-header">
                    <h3>My Playlists</h3>
                    <span class="favCount" id="playlist-count">— playlists</span>
                </div>
                <!-- Shows the playlist cards -->
                <div id="playlist-grid">
                    <p class="state-msg">Loading…</p>
                </div>
            </div>

            <!-- Drill-in view to see more info about the playlist -->
            <div id="playlist-drill-view" style="display:none;">
                <div class="drill-header">
                    <!-- Back button -->
                    <button class="back-btn" onclick="exitDrill()">← Back</button>
                    <div>
                        <div class="drill-title" id="drill-name">—</div>
                        <div class="drill-subtitle" id="drill-meta">—</div>
                    </div>
                    <!-- Option to play the songs in the playlist -->
                    <button class="drill-play-all" onclick="playAllDrill()">▶ Play All</button>
                </div>
                <div id="drill-library"></div>
            </div>
        </div>
    </div>

    <!-- Mini music player -->
    <div id="mini-player">
        <!-- Shows song photo -->
        <div id="mp-art-wrap">
            <div class="mp-art-placeholder">🎵</div>
        </div>
        <div class="mp-info">
            <!-- Shows song title -->
            <div class="mp-title" id="mp-title">—</div>
            <!-- Shows song artist -->
            <div class="mp-artist" id="mp-artist">—</div>
        </div>
        <div class="mp-controls">
            <!-- Play and pause button -->
            <button class="mp-btn play-pause" id="mp-playpause" onclick="togglePlayerPlayPause()">▶</button>
        </div>
        <div class="mp-progress-area">
            <!-- Shows what part of the song you're in -->
            <div class="mp-progress-track" id="mp-track" onclick="seekTo(event)">
                <div class="mp-progress-fill" id="mp-fill"></div>
            </div>
            <div class="mp-times">
                <span id="mp-current">0:00</span>
                <span id="mp-total">0:00</span>
            </div>
        </div>
        <div class="mp-volume">
            <!-- Shows the volume of the song the user can change. Or they can mute -->
            <span class="mp-vol-icon" onclick="toggleMute()">🔊</span>
            <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)">
        </div>
    </div>

    <div id="toast"></div>

    <script>
        /* ── Constants ── */

        // Backend URl for songs
        const API_BASE = "http://localhost:8080/api/songs";
        // Backend URL for playlists
        const PLAYLIST_BASE = "http://localhost:8080/api/playlists";

        // Creates a audio player object
        const player = new Audio();
        // Track current song playing
        let currentPlayingTitle = null;
        let currentPlayingSong = null;

        // Track volume status (if it's muted)
        let isMuted = false;

        // Stores the favorites
        let allFavorites = [];
        let allSongs = [];
        let allPlaylists = [];
        // Start on favorites tab
        let currentTab = 'favorites';
        let drillSongs = [];
        let drillQueue = [];
        let drillQueueIdx = -1;

        // Get the logged in user from local storage
        const currentUser = localStorage.getItem("currentUser");

        // If they aren't logged in, then redirect to the login page
        if (!currentUser) window.location.href = "index.html";

        // Show the username on the page
        document.getElementById("username-display").textContent = currentUser || "there";

        // Runs init function when the page loads
        window.onload = init;

        async function init() {
            try {
                const r = await fetch(API_BASE);
                allSongs = await r.json();
            } catch (e) { console.error("Could not load all songs", e); }
            // Loads the user's favorited songs
            loadFavorites();
        }

        /* Tab Switching */
        function switchTab(tab) {
            // Starts on favorites tab
            currentTab = tab;

            // Toggles the active button styles
            document.getElementById("tab-favs").classList.toggle("active", tab === "favorites");
            document.getElementById("tab-playlists").classList.toggle("active", tab === "playlists");
            // Showing/hiding sections 
            document.getElementById("view-favorites").style.display = tab === "favorites" ? "" : "none";
            document.getElementById("view-playlists").style.display = tab === "playlists" ? "" : "none";
            document.getElementById("search").value = "";
            // If user clicks playlists, then show the playlists
            if (tab === "playlists") loadPlaylists();
        }

        /* Search */
        function onSearch() {
            if (currentTab === "favorites") searchFavorites();
            else filterPlaylists();
        }

        /* Favorites */
        function loadFavorites() {
            document.getElementById("library").innerHTML = '<p class="state-msg">Loading…</p>';
            // Gets the favorites from backend 
            fetch(`${API_BASE}/favorites/${currentUser}`)
                .then(r => r.json())
                .then(data => {
                    allFavorites = data;
                    document.getElementById("fav-count").textContent =
                        `${data.length} favorite${data.length !== 1 ? 's' : ''}`;
                    renderFavCards(data);
                })
                .catch(() => {
                    document.getElementById("library").innerHTML =
                        '<p class="state-msg">Failed to load songs. Is the server running?</p>';
                });
        }

        // Filters the favorites based on search query
        function searchFavorites() {
            // Gets the text from the search bar input field and converts 
            // to lowercase
            const q = document.getElementById("search").value.toLowerCase().trim();

            // If the search box is empty, then show the full favorites
            if (!q) { 
                renderFavCards(allFavorites); 
                return; 
            }

            // Filter the favorites based on the search query
            renderFavCards(allFavorites.filter(s =>
                (s.title || "").toLowerCase().includes(q) ||
                (s.artist || "").toLowerCase().includes(q) ||
                (s.genre || "").toLowerCase().includes(q) ||
                (s.mood || "").toLowerCase().includes(q)
            ));
        }

        function renderFavCards(songs) {
            const container = document.getElementById("library");
            // If there's no songs
            if (!songs || songs.length === 0) {
                container.innerHTML = '<p class="state-msg">No saved songs yet — go browse and add some! 🎵</p>';
                return;
            }
            // Builds the HTML for each song
            container.innerHTML = songs.map(s => buildFavCard(s)).join("");
            loadDurations(songs, "fav");
            if (currentPlayingTitle) refreshPlayingState();
        }

        function buildFavCard(song) {
            const genre = song.genre || "";
            const mood = song.mood || "";
            // Makes single quote so the title doesn't break everything
            const safeTitle = song.title.replace(/'/g, "\\'");
            return `
                <div class="song" id="fav-card-${song.id}" data-title="${song.title}">
                    <div class="card-img-wrap">
                        <button class="fav-btn" onclick="removeFavorite('${song.id}', this)">💜</button>
                        <div class="card-overlay">
                            <button class="card-play-btn" onclick="playFromList('${song.id}','${safeTitle}','favorites')">▶</button>
                        </div>
                        <span class="duration-badge" id="fav-dur-${song.id}">—</span>
                        ${song.imageUrl
                    ? `<img src="${song.imageUrl}" alt="${song.title}">`
                    : `<div class="no-image">🎵</div>`}
                    </div>
                    <div class="song-info">
                        <strong>${song.title}</strong>
                        <span class="artist">${song.artist}</span>
                        <div class="song-tags">
                            ${genre ? `<span class="tag">${genre}</span>` : ''}
                            ${mood ? `<span class="tag">${mood}</span>` : ''}
                        </div>
                    </div>
                </div>`;
        }

        async function removeFavorite(songId, btn) {
            try {
                await fetch(`http://localhost:8080/api/users/${currentUser}/favorites/${songId}?isFavorite=false`, {
                    method: "PATCH"
                });
                // Shows a message that the song was removed as a favorite
                showToast("Removed from Favorites 🤍");
                const card = document.getElementById(`fav-card-${songId}`);
                if (card) {
                    // Makes the card have a fade out when it's removed from favorites
                    card.style.opacity = '0';
                    card.style.transform = 'scale(0.8)';
                    card.style.transition = '0.3s';
                    setTimeout(() => {
                        card.remove();
                        allFavorites = allFavorites.filter(s => s.id != songId);
                        document.getElementById("fav-count").textContent =
                            `${allFavorites.length} favorite${allFavorites.length !== 1 ? 's' : ''}`;
                        if (allFavorites.length === 0)
                            document.getElementById("library").innerHTML =
                                '<p class="state-msg">No saved songs yet — go browse and add some! 🎵</p>';
                    }, 300);
                }
            } catch (err) { showToast("Could not update favorite ❌"); }
        }

        /* Playlists Grid */
        async function loadPlaylists() {
            document.getElementById("playlist-grid").innerHTML = '<p class="state-msg">Loading…</p>';
            try {
                const r = await fetch(PLAYLIST_BASE + "/");
                allPlaylists = await r.json();
                filterPlaylists();
            } catch (e) {
                document.getElementById("playlist-grid").innerHTML =
                    '<p class="state-msg">Failed to load playlists. Is the server running?</p>';
            }
        }

        function filterPlaylists() {
            const q = document.getElementById("search").value.toLowerCase().trim();
            const filtered = q ? allPlaylists.filter(p => p.name.toLowerCase().includes(q)) : allPlaylists;
            document.getElementById("playlist-count").textContent =
                `${filtered.length} playlist${filtered.length !== 1 ? 's' : ''}`;
            renderPlaylistGrid(filtered);
        }

        /* Build mosaic art: up to 4 album covers from the playlist's songs */
        function buildMosaicArt(playlist) {
            const songIds = playlist.songIds || [];
            const imaged = songIds
                .map(id => allSongs.find(s => s.id == id))
                .filter(s => s && s.imageUrl)
                .slice(0, 4);

            if (imaged.length === 0) {
                return `<div class="mosaic-fallback">🎶</div>`;
            }
            if (imaged.length === 1) {
                return `<img class="mosaic-single" src="${imaged[0].imageUrl}" alt="${imaged[0].title}">`;
            }
            // 2–4 images: fill a 2×2 grid, pad empties
            const cells = Array.from({ length: 4 }, (_, i) =>
                imaged[i]
                    ? `<img src="${imaged[i].imageUrl}" alt="${imaged[i].title}">`
                    : `<div class="mosaic-empty">🎵</div>`
            ).join("");
            return `<div class="mosaic-grid">${cells}</div>`;
        }

        function renderPlaylistGrid(playlists) {
            const container = document.getElementById("playlist-grid");
            if (!playlists || playlists.length === 0) {
                container.innerHTML = '<p class="state-msg">No playlists yet — create one on the Browse page! 🎶</p>';
                return;
            }
            container.innerHTML = playlists.map(p => {
                const count = p.songIds ? p.songIds.length : 0;
                const isPrivate = p.isPrivate === true || p.private === true;
                const badge = isPrivate
                    ? '<span class="privacy-badge badge-private">🔒 Private</span>'
                    : '<span class="privacy-badge badge-public">🌐 Public</span>';
                return `
                    <div class="playlist-card" onclick="drillInto('${p.id}')">
                        <div class="playlist-card-art">
                            ${buildMosaicArt(p)}
                            <span class="song-count-badge">${count} song${count !== 1 ? 's' : ''}</span>
                            <div class="playlist-card-overlay">
                                <button class="playlist-play-btn"
                                    onclick="event.stopPropagation(); playPlaylistNow('${p.id}')">▶</button>
                            </div>
                        </div>
                        <div class="playlist-card-info">
                            <strong>${p.name}</strong>
                            <div class="playlist-card-meta">${badge}</div>
                        </div>
                    </div>`;
            }).join("");
        }

        /* Drill-in view */
        // Opens a specific playlist in drill view (or expanded view)
        function drillInto(playlistId) {
            // Finds the playlist object that matches
            const playlist = allPlaylists.find(p => p.id == playlistId);
            // Stops if no playlist is found
            if (!playlist) return;

            // Gets the list of song IDs from the playlist
            const songIds = playlist.songIds || [];

            // Converts song IDs into full song objects 
            drillSongs = songIds.map(id => allSongs.find(s => s.id == id)).filter(Boolean);

            // Sets playlist name in the drill view
            document.getElementById("drill-name").textContent = playlist.name;

            // Determines if the playlist is private 
            const isPrivate = playlist.isPrivate === true || playlist.private === true;
            // Displays the metadata for the playlist
            document.getElementById("drill-meta").textContent =
                `${drillSongs.length} song${drillSongs.length !== 1 ? 's' : ''} · ${isPrivate ? '🔒 Private' : '🌐 Public'}`;

            // Hides main playlist grid view
            document.getElementById("playlist-grid-view").style.display = "none";

            // Shows the drill view
            document.getElementById("playlist-drill-view").style.display = "";

            // Renders all song cards inside the drill view
            renderDrillCards(drillSongs);
        }

        // Exits the drill (playlist info) view and goes back to main
        // playlist view
        function exitDrill() {
            // Hides the drill 
            document.getElementById("playlist-drill-view").style.display = "none";

            // Shows main playlist grid view
            document.getElementById("playlist-grid-view").style.display = "";

            // Clears the search input field
            document.getElementById("search").value = "";

            // Resets drill song array 
            drillSongs = [];
        }

        // Renders all the song cards inside the drill playlist view
        function renderDrillCards(songs) {
            // Gets the container where drill songs will be displayed
            const container = document.getElementById("drill-library");

            // If there's no songs, show a message and stop
            if (!songs || songs.length === 0) {
                container.innerHTML = '<p class="state-msg">No songs in this playlist yet — add some from Browse! 🎵</p>';
                return;
            }

            // Builds and insrts the grid of songs cards as HTML
            container.innerHTML = `
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;">
                    ${songs.map(song => buildDrillCard(song)).join("")}
                </div>`;
            // Loads/shows the durations for each song
            loadDurations(songs, "drill");

            // If a song is currently playing, update the UI
            if (currentPlayingTitle) refreshPlayingState();
        }

        // Builds and returns HTML card for a song
        function buildDrillCard(song) {
            // Get genre 
            const genre = song.genre || "";
            // Get mood
            const mood = song.mood || "";
            // Escape single quotes so it doesn't break the string
            const safeTitle = song.title.replace(/'/g, "\\'");
            // Checks if the song is favorited
            const isFav = allFavorites.some(f => f.id == song.id);

            // Returns a string that builds the HTML card
            return `
                <div class="song" id="drill-card-${song.id}" data-title="${song.title}">
                    <div class="card-img-wrap">
                        <button class="fav-btn" onclick="toggleDrillFavorite('${song.id}', this)">
                            ${isFav ? '💜' : '🤍'}
                        </button>
                        <div class="card-overlay">
                            <button class="card-play-btn" onclick="playFromList('${song.id}','${safeTitle}','drill')">▶</button>
                        </div>
                        <span class="duration-badge" id="drill-dur-${song.id}">—</span>
                        ${song.imageUrl
                    ? `<img src="${song.imageUrl}" alt="${song.title}">`
                    : `<div class="no-image">🎵</div>`}
                    </div>
                    <div class="song-info">
                        <strong>${song.title}</strong>
                        <span class="artist">${song.artist}</span>
                        <div class="song-tags">
                            ${genre ? `<span class="tag">${genre}</span>` : ''}
                            ${mood ? `<span class="tag">${mood}</span>` : ''}
                        </div>
                    </div>
                </div>`;
        }

        // Marks a song as favorite or in a drill list
        async function toggleDrillFavorite(songId, btn) {
            // Checks current favorite status based on the button
            const isCurrentlyFav = btn.textContent.trim() === '💜';

            // Flips the state of the favorite
            const nextState = !isCurrentlyFav;

            try {
                // Tries to update the favorite status on the backend
                await fetch(`http://localhost:8080/api/users/${currentUser}/favorites/${songId}?isFavorite=${nextState}`, {
                    method: "PATCH"
                });

                // Update the button UI to reflect the status change
                btn.textContent = nextState ? '💜' : '🤍';
                // Keep allFavorites in sync so switching tabs shows correct state
                if (nextState) {
                    // Finds full song objects from allSongs
                    const song = allSongs.find(s => s.id == songId);
                    // If it exists and isn't already in favorites, then add it
                    if (song && !allFavorites.some(f => f.id == songId)) allFavorites.push(song);
                } else {
                    // If it's removed from favorites, filter it out of the list
                    allFavorites = allFavorites.filter(s => s.id != songId);
                }

                // Show message based on what the user did 
                showToast(nextState ? "Added to Favorites! 💜" : "Removed from Favorites 🤍");
            } catch (err) {
                // If something goes wrong, show an error message
                showToast("Error updating favorite ❌");
            }
        }

        /* Playlist playback */

        // Plays full playlist
        function playPlaylistNow(playlistId) {
            // Finds the playlist object that matches the ID
            const playlist = allPlaylists.find(p => p.id == playlistId);

            // If it doesn't exist or is empty, show a message
            if (!playlist || !playlist.songIds || playlist.songIds.length === 0) {
                showToast("This playlist has no songs yet 🎵");
                return;
            }

            // Converts song IDs into song objects
            const songs = playlist.songIds.map(id => allSongs.find(s => s.id == id)).filter(Boolean);

            // If there's no valid songs, show a message and stop
            if (songs.length === 0) { 
                showToast("No playable songs found 🎵"); 
                return; 
            }

            // Sets drill list to this playlist's songs
            drillSongs = songs;
            // Creates a playback queue from the playlist
            drillQueue = [...songs];
            // Starts at the first song in the queue
            drillQueueIdx = 0;
            // Starts playing the first song 
            startSong(songs[0]);
        }

        // Plays all songs in the current drill list
        function playAllDrill() {
            // If there's no drill songs, show a message and stop
            if (!drillSongs || drillSongs.length === 0) {
                showToast("No songs to play 🎵");
                return;
            }

            // Copy drill songs into the queue
            drillQueue = [...drillSongs];
            // Start from beginning of queue
            drillQueueIdx = 0;
            // Play the first song
            startSong(drillQueue[0]);
        }

        // Function to start playing a specific song
        function startSong(song) {
            // Stores the full song object
            currentPlayingSong = song;

            // Stores just the title of the song
            currentPlayingTitle = song.title;

            // Builds the file path for the audio file based on the title
            player.src = `audio/${song.title}.mp3`;

            // Shows an error if song doesn't have a file
            player.play().catch(() => showToast("Audio file not found: " + song.title + ".mp3"));

            // Updates the mini player title text
            document.getElementById("mp-title").textContent = song.title;

            // Updates the mini player artist text
            document.getElementById("mp-artist").textContent = song.artist || "";

            // Gets container for the albumn photo
            const artWrap = document.getElementById("mp-art-wrap");
            // Shows the image or a placeholder if it doesn't have one
            artWrap.innerHTML = song.imageUrl
                ? `<img class="mp-art" src="${song.imageUrl}" alt="${song.title}">`
                : `<div class="mp-art-placeholder">🎵</div>`;

            // Makes the mini player visible
            document.getElementById("mini-player").classList.add("visible");

            // Updates play/pause status
            refreshPlayingState();
        }

        /* General Playback */

        // Plays a song from the list
        function playFromList(songId, songTitle, source) {
            // If the clicked song is already playing
            if (currentPlayingTitle === songTitle) {
                // Play or pause it instead of restarting it
                togglePlayerPlayPause();
                return;
            }

            // Choose what list to pull the song from
            const list = source === "drill" ? drillSongs : allFavorites;

            // Find the song object by matching its title
            const song = list.find(s => s.title === songTitle) || { title: songTitle, artist: "" };

            // If its in the drill playlist
            if (source === "drill") {
                // Put the songs into a playback queue
                drillQueue = [...drillSongs];
                // Get the index of the song in the queue
                drillQueueIdx = drillQueue.findIndex(s => s.id == songId);
            } else {
                // If not a drill then clear the queue
                drillQueue = [];
                // Restart the queue index
                drillQueueIdx = -1;
            }

            // Start playing the selected song
            startSong(song);
        }

        // Updates the UI to show what song is playing 
        function refreshPlayingState() {
            // Loops through the songs 
            document.querySelectorAll(".song").forEach(card => {
                // Checks if this is the song currently playing 
                const isThis = card.dataset.title === currentPlayingTitle;

                // Adds or removes the is-playing class if it's the current song
                // playing and if the player hasn't paused it
                card.classList.toggle("is-playing", isThis && !player.paused);

                // Finds the play/pause button
                const btn = card.querySelector(".card-play-btn");

                // Updates icon to show play/pause depending on the user
                if (btn) btn.textContent = (isThis && !player.paused) ? "⏸" : "▶";
            });

            // Updates play/pause icon to show play if paused and pause if playing
            document.getElementById("mp-playpause").textContent = player.paused ? "▶" : "⏸";
        }

        function togglePlayerPlayPause() {
            if (!currentPlayingTitle) return;
            player.paused ? player.play() : player.pause();
        }

        player.addEventListener("play", refreshPlayingState);
        player.addEventListener("pause", refreshPlayingState);
        player.addEventListener("ended", () => {
            // Auto-advance through playlist queue
            if (drillQueue.length > 0 && drillQueueIdx < drillQueue.length - 1) {
                drillQueueIdx++;
                startSong(drillQueue[drillQueueIdx]);
            } else {
                currentPlayingTitle = null;
                drillQueue = [];
                drillQueueIdx = -1;
                refreshPlayingState();
                document.getElementById("mp-fill").style.width = "0%";
                document.getElementById("mp-current").textContent = "0:00";
            }
        });

        // Listener for when the metadata (like duration) has loaed
        player.addEventListener("loadedmetadata", () => {
            // Gets total duration of the song and formats it
            document.getElementById("mp-total").textContent = fmt(player.duration);
        });

        // Listener for updates to the playback time 
        player.addEventListener("timeupdate", () => {
            // If duration isn't available then stop
            if (!player.duration) return;

            // Calculates how far along the media is as a percentage
            const pct = (player.currentTime / player.duration) * 100;

            // Updates the progress bar using the percentage
            document.getElementById("mp-fill").style.width = pct + "%";

            // Updates the displayed current time using the fmt function 
            document.getElementById("mp-current").textContent = fmt(player.currentTime);
        });

        // Jumps to a new spot in the media when the user clicks the bar
        function seekTo(e) {
            // If duration isn't available then stop
            if (!player.duration) return;

            // Gets the size and position of the bar
            const rect = e.currentTarget.getBoundingClientRect();

            // Calculates where the user clicked in reference to the bar's width and 
            // adjusts the songs time using that
            player.currentTime = ((e.clientX - rect.left) / rect.width) * player.duration;
        }

        // Allows the user to change volume of the song
        function setVolume(v) {
            player.volume = v;
            // Sets the volume to zerro if it's muted
            isMuted = (v == 0);
        }

        // Handles muting the song when the user clicks on it
        function toggleMute() {
            isMuted = !isMuted;
            player.muted = isMuted;
            // Changes the icon 
            document.querySelector(".mp-vol-icon").textContent = isMuted ? "🔇" : "🔊";
        }

        /* Duration loader */
        function loadDurations(songs, prefix) {
            songs.forEach(song => {
                const probe = new Audio(`audio/${song.title}.mp3`);
                probe.preload = "metadata";
                probe.addEventListener("loadedmetadata", () => {
                    const el = document.getElementById(`${prefix}-dur-${song.id}`);
                    if (el) el.textContent = fmt(probe.duration);
                });
            });
        }

        /* Helper methods */

        // Formats a time value into a string to show the duration
        function fmt(s) {
            // If the value isn't a valid number, then put a placeholder
            if (!isFinite(s) || isNaN(s)) return "—";

            // Converts seconds into minutes and seconds format
            return `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2, "0")}`;
        }

        // Helps reset if a new toast appears
        let toastTimer;

        // Displays a toast notification message on the screen
        function showToast(msg) {
            const t = document.getElementById("toast");
            if (!t) return;
            clearTimeout(toastTimer);
            t.textContent = msg;
            t.classList.add("show");
            toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
        }

        // If user clicks on the profile button, this takes them to their profile
        function goToProfile() {
            window.location.href = "profile.html";

        }

        // Function to log the user out of their account if they click logout
        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "http://localhost:8080/index.html";
        }
    </script>
</body>
