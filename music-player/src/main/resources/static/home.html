<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #121212;
            color: white;
        }

        .navbar {
            background: #2a5298;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            padding: 6px 12px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
        }

        button:hover {
            opacity: 0.8;
        }

        .song {
            background: #1e1e1e;
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            position: relative;
        }

        .fav-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
            padding: 0;
            z-index: 10;
        }

        .fav-btn:hover {
            transform: scale(1.2);
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>🎵 My Library</h2>
        <div>
            <button onclick="window.location.href='songs.html'">Browse Songs</button>
            <button onclick="goToProfile()">Profile</button>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <div style="padding:20px;">
        <input type="text" id="search" placeholder="Search your library..." onkeyup="searchLibrary()"
            style="padding:8px; width:60%;">
    </div>

    <h3 style="padding-left:20px;">Saved Songs</h3>
    <div id="library" style="padding:20px;">Loading...</div>

    <script>

        let currentUser = localStorage.getItem("currentUser");

        if (!currentUser) {
            // window.location.href = "https://music-player-m56j.onrender.com/index.html";
            window.location.href = "index.html"; 
        }

        window.onload = loadLibrary;

        function loadLibrary() {
            fetch("http://localhost:8080/api/songs")
                .then(res => res.json())
                .then(data => {
                    let libraryDiv = document.getElementById("library");
                    libraryDiv.innerHTML = "";

                    if (!data || data.length === 0) {
                        libraryDiv.innerHTML = "<p>No songs found.</p>";
                        return;
                    }

                    data.forEach(song => {
                        libraryDiv.innerHTML += `
                        <div class="song">
                            <button 
                                class="fav-btn ${song.isFavorite ? 'active' : 'inactive'}" 
                                onclick="toggleFavorite('${song.id}', this)"
                            >
                                ${song.isFavorite ? '❤️' : '🤍'}
                            </button>
                            ${song.imageUrl
                                ? `<img src="${song.imageUrl}" 
                                    style="width:100%;height:120px;object-fit:contain;border-radius:6px;background:#333;">`
                                : `<div style="height:120px;background:#333;border-radius:6px;
                                    display:flex;align-items:center;justify-content:center;
                                    color:#888;">No Image</div>`}
                            <strong>${song.title}</strong><br>
                            <span style="color:#aaa;">${song.artist} · ${song.genre} · ${song.mood}</span>
                        </div>
                    `;
                    });
                })
                .catch(err => {
                    document.getElementById("library").innerHTML = "Failed to load songs.";
                    console.error(err);
                });
        }

        function searchLibrary() {
    let query = document.getElementById("search").value.toLowerCase().trim();

    if (query === "") {
        loadLibrary();
        return;
    }

    fetch("http://localhost:8080/api/songs")
        .then(res => res.json())
        .then(data => {
            let libraryDiv = document.getElementById("library");
            let filtered = data.filter(song =>
                song.title.toLowerCase().includes(query) ||
                song.artist.toLowerCase().includes(query) ||
                song.genre.toLowerCase().includes(query) ||
                song.mood.toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                libraryDiv.innerHTML = "<p>No songs found.</p>";
                return;
            }

            libraryDiv.innerHTML = filtered.map(song => `
                <div class="song">
                    <button class="fav-btn ${song.isFavorite ? 'active' : 'inactive'}"
                        onclick="toggleFavorite('${song.id}', this)">
                        ${song.isFavorite ? '❤️' : '🤍'}
                    </button>
                    ${song.imageUrl
                        ? `<img src="${song.imageUrl}"
                            style="width:100%;height:120px;object-fit:contain;border-radius:6px;background:#333;">`
                        : `<div style="height:120px;background:#333;border-radius:6px;
                            display:flex;align-items:center;justify-content:center;color:#888;">No Image</div>`}
                    <strong>${song.title}</strong><br>
                    <span style="color:#aaa;">${song.artist} · ${song.genre} · ${song.mood}</span>
                </div>
            `).join("");
        })
        .catch(err => console.error("Search failed:", err));
    }          

        function goToProfile() {
            window.location.href = "profile.html";
        }

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "http://localhost:8080/index.html";
        }

        async function toggleFavorite(songId, btn) {
            const isCurrentlyFav = btn.classList.contains("active");
            const newFavState = !isCurrentlyFav;

            btn.classList.toggle("active", newFavState);
            btn.classList.toggle("inactive", !newFavState);
            btn.textContent = newFavState ? "❤️" : "🤍";

            try {
                // const response = await fetch(`https://music-player-m56j.onrender.com/api/songs/${songId}/favorite?isFavorite=${newFavState}`,
                const response = await fetch(`http://localhost:8080/api/songs/${songId}/favorite?isFavorite=${newFavState}`,
                { method: "PATCH" }
                );
                if (!response.ok) throw new Error("Failed");
            } catch (err) {
                btn.classList.toggle("active", isCurrentlyFav);
                btn.textContent = isCurrentlyFav ? "❤️" : "🤍";
                alert("Could not update favorite. Please try again.");
            }
        }

    </script>
</body>

</html>
