<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #8A84E2, #ddd9fb);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-weight: 600;
            color: #8A84E2;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #8A84E2;
            color: white;
            border: none;
            border-radius: 6px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            font-weight: 400;
        }

        button:hover {
            background: #372554;
        }

        a {
            color: #2a5298;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Welcome Back 🎵</h1>
        <form id="loginForm">
            <input type="text" id="username" name="username" placeholder="Username" required>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <p id="message" style="color:red;"></p>

        <p>Don't have an account? <a href="register.html">Sign up</a></p>
    </div>

    <script>
        const form = document.getElementById("loginForm");

        form.addEventListener("submit", function (e) {
            e.preventDefault(); // 🚨 stops page refresh (THIS is the key)

            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;

            if (!username || !password) {
                document.getElementById("message").innerText = "Please enter username and password.";
                return;
            }

            fetch("http://localhost:8080/api/users/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            })
                .then(async res => {
                    const text = await res.text();
                    if (!res.ok) throw new Error(text);
                    return text;
                })
                .then(data => {
                    if (data.toLowerCase().includes("successful")) {
                        localStorage.setItem("currentUser", username);
                        window.location.href = "home.html";
                    } else {
                        document.getElementById("message").innerText = data;
                    }
                })
                .catch(err => {
                    document.getElementById("message").innerText = err.message || "Login failed";
                });
        });
    </script>

</body>

</html>
