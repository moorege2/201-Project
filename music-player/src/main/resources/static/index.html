<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>




<style>
body {
   margin: 0;
   font-family: Arial, sans-serif;
   background: linear-gradient(135deg,#8A84E2, #ddd9fb);
   display: flex;
   justify-content: center;
   align-items: center;
   height: 100vh;
}

.card {
   background: white;
   padding: 40px;
   border-radius: 12px;
   width: 350px;
   box-shadow: 0 20px 60px rgba(0,0,0,0.5);
   text-align: center;
}


h1 {
   margin-bottom: 20px;
   font-weight: 600;
   color: #8A84E2;
}

input {
   width: 100%;
   padding: 10px;
   margin: 10px 0;
   border-radius: 6px;
   border: 1px solid #ccc;
   box-sizing: border-box;
}

button {
   width: 100%;
   padding: 12px;
   margin-top: 15px;
   background: #8A84E2;
   color: white;
   border: none;
   border-radius: 6px;
   text-shadow: 0 1px 2px rgba(0,0,0,0.4); 
   cursor: pointer;
   font-weight: 400;
}

button:hover {
   background: #372554;
}

a {
   color: #2a5298;
   text-decoration: none;
}
</style>
</head>

<body>

<div class="card">
    <h1>Welcome Back 🎵</h1>

    <form id="loginForm">
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button type="submit">Log In</button>
    </form>

    <p id="message" style="color:red;"></p>

    <p>Don't have an account? <a href="register.html">Sign up</a></p>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault(); // stops page refresh

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if (!username || !password) {
        document.getElementById("message").innerText = "Please enter username and password.";
        return;
    }

    const BACKEND_URL = "http://localhost:8080/api/users/login";

    fetch(BACKEND_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            username: username,
            password: password
        })
    })
    .then(async res => {
        if (res.ok) return res.text();
        const errorData = await res.text();
        throw new Error(errorData || "Login failed");
    })
    .then(data => {
        if (data.toLowerCase().includes("successful")) {
            localStorage.setItem("currentUser", username);
            window.location.href = "home.html";
        } else {
            document.getElementById("message").innerText = data;
        }
    })
    .catch(err => {
        console.error(err);
        document.getElementById("message").innerText = "Connection error.";
    });
});
</script>

</body>
</html>
