<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Song Library</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            padding: 20px;
        }

        h1 {
            color: #1DB954;
        }

        .search-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-bar input,
        .search-bar select {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            background-color: #282828;
            color: white;
            font-size: 14px;
        }

        .search-bar button {
            padding: 8px 16px;
            background-color: #1DB954;
            color: black;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #song-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .song-card {
            background-color: #282828;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            transition: transform 0.2s;
        }

        .song-card:hover {
            transform: translateY(-5px);
            background-color: #333;
        }

        .mini-play-btn {
            position: absolute;
            bottom: 85px;
            right: 15px;
            background-color: #1DB954;
            color: black;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.3s, transform 0.2s;
            z-index: 5;
        }

        .song-card:hover .mini-play-btn {
            opacity: 1;
        }

        .song-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .song-info {
            padding: 12px;
            text-align: center;
        }

        .song-info h3 {
            margin: 0 0 4px 0;
            font-size: 15px;
            color: #fff;
        }

        .song-info p {
            margin: 3px 0;
            font-size: 13px;
            color: #aaa;
        }

        .fav-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(50, 50, 50, 0.75);
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .add-playlist-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(50, 50, 50, 0.75);
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .add-playlist-btn:hover {
            transform: scale(1.2);
        }

        #playlist-panel {
            position: fixed;
            top: 0;
            right: -350px;
            width: 320px;
            height: 100%;
            background: #1e1e1e;
            padding: 20px;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.6);
            transition: right 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
        }

        #playlist-panel.open {
            right: 0;
        }

        #playlist-panel h2 {
            color: #1DB954;
            margin-top: 0;
        }

        #playlist-panel input {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: none;
            background: #282828;
            color: white;
            margin-bottom: 8px;
            box-sizing: border-box;
        }

        #playlist-panel button {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .playlist-item {
            background: #282828;
            border-radius: 8px;
            padding: 10px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist-item button {
            background: #1DB954;
            color: black;
            font-size: 12px;
            padding: 4px 10px;
        }

        #close-panel-btn {
            background: #e74c3c;
            color: white;
            margin-bottom: 16px;
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 999;
        }

        #overlay.show {
            display: block;
        }
    </style>
</head>

<body>

    <div style="background:#2a5298;padding:15px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2 style="margin:0;">🎵 Song Library</h2>
        <div>
            <button onclick="window.location.href='home.html'"
                style="background:white;color:#2a5298;margin-right:8px;border-radius:6px;padding:6px 12px;border:none;cursor:pointer;">Home</button>
            <button onclick="window.location.href='profile.html'"
                style="background:white;color:#2a5298;margin-right:8px;border-radius:6px;padding:6px 12px;border:none;cursor:pointer;">Profile</button>
            <button onclick="togglePlaylistPanel()"
                style="background:#1DB954;color:black;margin-right:8px;border-radius:6px;padding:6px 12px;border:none;cursor:pointer;font-weight:bold;">🎶 Playlists</button>
            <button onclick="logout()"
                style="background:#e74c3c;color:white;border-radius:6px;padding:6px 12px;border:none;cursor:pointer;">Logout</button>
        </div>
    </div>

    <h1>🎵 Song Library</h1>

    <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search...">
        <select id="search-type">
            <option value="all">All Songs</option>
            <option value="title">By Title</option>
            <option value="artist">By Artist</option>
            <option value="genre">By Genre</option>
            <option value="mood">By Mood</option>
        </select>
        <button onclick="searchSongs()">Search</button>
        <button onclick="loadAllSongs()">Reset</button>
    </div>

    <div id="song-list">Loading songs...</div>

    <div id="overlay" onclick="togglePlaylistPanel()"></div>

    <div id="playlist-panel">
        <button id="close-panel-btn" onclick="togglePlaylistPanel()">✕ Close</button>
        <h2>🎶 My Playlists</h2>
        <div style="margin-bottom:16px;">
            <input type="text" id="new-playlist-name" placeholder="New playlist name...">
            <label style="font-size:13px;color:#aaa;display:flex;align-items:center;gap:6px;">
                <input type="checkbox" id="new-playlist-private"> Make Private
            </label>
            <button onclick="createPlaylist()" style="background:#1DB954;color:black;">+ Create Playlist</button>
        </div>
        <div id="playlist-list">Loading playlists...</div>
    </div>

    <script>
        const API_BASE = "http://localhost:8080/api/songs";
        const PLAYLIST_BASE = "http://localhost:8080/api/playlists";
        const player = new Audio();
        let currentPlayingTitle = null;
        let selectedSongId = null;
        const currentUser = localStorage.getItem("currentUser");

        window.onload = loadAllSongs;

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }

        function loadAllSongs() {
            fetch(API_BASE)
                .then(res => res.json())
                .then(songs => displaySongs(songs))
                .catch(err => {
                    document.getElementById("song-list").innerHTML = "Failed to load songs.";
                    console.error(err);
                });
        }

        function displaySongs(songs) {
            const container = document.getElementById("song-list");
            if (!songs || songs.length === 0) {
                container.innerHTML = "<p>No songs found.</p>";
                return;
            }
            container.innerHTML = songs.map(song => buildCard(song)).join("");
        }

        function buildCard(song) {
            return `
                <div class="song-card">
                    <button class="fav-btn ${song.isFavorite ? 'active' : 'inactive'}"
                        onclick="toggleFavorite('${song.id}', this)">
                        ${song.isFavorite ? '❤️' : '🤍'}
                    </button>
                    <button class="add-playlist-btn" title="Add to playlist"
                        onclick="openPanelForSong('${song.id}')">➕</button>
                    <button class="mini-play-btn" onclick="playMusic('${song.title}')">▶</button>
                    ${song.imageUrl
                        ? `<img src="${song.imageUrl}" alt="${song.title}">`
                        : `<div class="no-image" style="height:200px;background:#444;display:flex;align-items:center;justify-content:center;">No Image</div>`}
                    <div class="song-info">
                        <h3>${song.title}</h3>
                        <p>${song.artist}</p>
                        <p>${song.genre} · ${song.mood}</p>
                    </div>
                </div>
            `;
        }

        function playMusic(songTitle) {
            const filePath = `audio/${songTitle}.mp3`;

            if (currentPlayingTitle === songTitle) {
                if (!player.paused) {
                    player.pause();
                } else {
                    player.play();
                }
                return;
            }

            currentPlayingTitle = songTitle;
            player.src = filePath;
            player.play().catch(err => {
                console.error("Playback error:", err);
                alert("File not found: " + songTitle + ".mp3");
            });
        }

        async function toggleFavorite(songId, btn) {
            const isCurrentlyFav = btn.textContent.trim() === "❤️";
            const newFavState = !isCurrentlyFav;

            btn.textContent = newFavState ? "❤️" : "🤍";

            try {
                const response = await fetch(`${API_BASE}/${songId}/favorite?isFavorite=${newFavState}`, { method: "PATCH" });
                if (!response.ok) throw new Error("Failed");
            } catch (err) {
                btn.textContent = isCurrentlyFav ? "❤️" : "🤍";
                alert("Could not update favorite.");
            }
        }

        function searchSongs() {
            const type = document.getElementById("search-type").value;
            const query = document.getElementById("search-input").value.trim().toLowerCase();

            fetch(API_BASE)
                .then(res => res.json())
                .then(songs => {
                    const filtered = songs.filter(song => {
                        if (query === "") return true;
                        const val = type === "all"
                            ? (song.title + song.artist + song.genre + song.mood).toLowerCase()
                            : song[type].toLowerCase();
                        return val.includes(query);
                    });
                    displaySongs(filtered);
                });
        }

        function togglePlaylistPanel() {
            const panel = document.getElementById("playlist-panel");
            const overlay = document.getElementById("overlay");
            panel.classList.toggle("open");
            overlay.classList.toggle("show");
            if (panel.classList.contains("open")) {
                loadPlaylists();
            }
        }

        function openPanelForSong(songId) {
            selectedSongId = songId;
            togglePlaylistPanel();
        }

        function loadPlaylists() {
            fetch(`${PLAYLIST_BASE}/`)
                .then(res => res.json())
                .then(playlists => {
                    const container = document.getElementById("playlist-list");
                    if (!playlists || playlists.length === 0) {
                        container.innerHTML = "<p style='color:#aaa;'>No playlists yet.</p>";
                        return;
                    }
                    container.innerHTML = playlists.map(p => `
                        <div class="playlist-item">
                            <span>${p.name} ${p.isPrivate ? '🔒' : '🌐'}</span>
                            ${selectedSongId
                                ? `<button onclick="addSongToPlaylist('${p.id}')">Add Song</button>`
                                : ''}
                        </div>
                    `).join("");
                })
                .catch(err => {
                    document.getElementById("playlist-list").innerHTML = "Failed to load playlists.";
                    console.error(err);
                });
        }

        function createPlaylist() {
            const name = document.getElementById("new-playlist-name").value.trim();
            const isPrivate = document.getElementById("new-playlist-private").checked;

            if (!name) {
                alert("Please enter a playlist name.");
                return;
            }

            fetch(`${PLAYLIST_BASE}/?username=${currentUser}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: name, isPrivate: isPrivate, songIds: [] })
            })
                .then(res => res.json())
                .then(() => {
                    document.getElementById("new-playlist-name").value = "";
                    document.getElementById("new-playlist-private").checked = false;
                    loadPlaylists();
                })
                .catch(err => {
                    alert("Could not create playlist.");
                    console.error(err);
                });
        }

        function addSongToPlaylist(playlistId) {
            if (!selectedSongId) {
                alert("No song selected.");
                return;
            }

            fetch(`${PLAYLIST_BASE}/${playlistId}/songs/${selectedSongId}`, { method: "PUT" })
                .then(res => {
                    if (!res.ok) throw new Error("Failed");
                    alert("Song added to playlist!");
                    selectedSongId = null;
                    togglePlaylistPanel();
                })
                .catch(err => {
                    alert("Could not add song to playlist.");
                    console.error(err);
                });
        }
    </script>

</body>

</html>
