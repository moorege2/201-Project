<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Song Library</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            padding: 20px;
        }

        h1 {
            color: #1DB954;
        }

        .search-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-bar input,
        .search-bar select {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            background-color: #282828;
            color: white;
            font-size: 14px;
        }

        .search-bar button {
            padding: 8px 16px;
            background-color: #1DB954;
            color: black;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #song-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .song-card {
            background-color: #282828;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            transition: transform 0.2s;
        }

        .song-card:hover {
            transform: translateY(-5px);
            background-color: #333;
        }

        .mini-play-btn {
            position: absolute;
            bottom: 85px;
            right: 15px;
            background-color: #1DB954;
            color: black;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.3s, transform 0.2s;
            z-index: 5;
        }

        .song-card:hover .mini-play-btn {
            opacity: 1;
        }

        .song-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .song-info {
            padding: 12px;
            text-align: center;
        }

        .song-info h3 {
            margin: 0 0 4px 0;
            font-size: 15px;
            color: #fff;
        }

        .song-info p {
            margin: 3px 0;
            font-size: 13px;
            color: #aaa;
        }

        .fav-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(50, 50, 50, 0.75);
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div
        style="background:#2a5298;padding:15px;display:flex; justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2 style="margin:0;">🎵 Song Library</h2>
        <div>
            <button onclick="window.location.href='home.html'"
                style="background:white;color:#2a5298;margin-right:8px;border-radius:6px;padding:6px 12px;border:none;cursor:pointer;">Home</button>
            <button onclick="window.location.href='profile.html'"
                style="background:white;color:#2a5298;margin-right:8px;border-radius:6px;padding:6px 12px;border:none;cursor:pointer;">Profile</button>
            <button onclick="logout()"
                style="background:#e74c3c;color:white;border-radius:6px;padding:6px 12px;border:none;cursor:pointer;">Logout</button>
        </div>
    </div>

    <h1>🎵 Song Library</h1>

    <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search...">
        <select id="search-type">
            <option value="all">All Songs</option>
            <option value="title">By Title</option>
            <option value="artist">By Artist</option>
            <option value="genre">By Genre</option>
            <option value="mood">By Mood</option>
        </select>
        <button onclick="searchSongs()">Search</button>
        <button onclick="loadAllSongs()">Reset</button>
    </div>

    <div id="song-list">Loading songs...</div>

    <script>
        const API_BASE = "http://localhost:8080/api/songs";
        const player = new Audio();
        let currentPlayingTitle = null; // Variable to keep track for the play/pause toggle

        window.onload = loadAllSongs;

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }

        function loadAllSongs() {
            fetch(API_BASE)
                .then(res => res.json())
                .then(songs => displaySongs(songs))
                .catch(err => {
                    document.getElementById("song-list").innerHTML = "Failed to load songs.";
                    console.error(err);
                });
        }

        function displaySongs(songs) {
            const container = document.getElementById("song-list");
            if (!songs || songs.length === 0) {
                container.innerHTML = "<p>No songs found.</p>";
                return;
            }
            container.innerHTML = songs.map(song => buildCard(song)).join("");
        }

        function buildCard(song) {
            return `
                <div class="song-card">
                    <button class="fav-btn ${song.isFavorite ? 'active' : 'inactive'}"
                        onclick="toggleFavorite('${song.id}', this)">
                        ${song.isFavorite ? '❤️' : '🤍'}
                    </button>
                    <button class="mini-play-btn" onclick="playMusic('${song.title}')">▶</button>
                    ${song.imageUrl
                    ? `<img src="${song.imageUrl}" alt="${song.title}">`
                    : `<div class="no-image" style="height:200px; background:#444; display:flex; align-items:center; justify-content:center;">No Image</div>`}
                    <div class="song-info">
                        <h3>${song.title}</h3>
                        <p>${song.artist}</p>
                        <p>${song.genre} · ${song.mood}</p>
                    </div>
                </div>
            `;
        }

        function playMusic(songTitle) {
            const filePath = `audio/${songTitle}.mp3`;

            // THE PAUSE FIX: Check if we are clicking the same song
            if (currentPlayingTitle === songTitle) {
                if (!player.paused) {
                    player.pause();
                    console.log("Paused:", songTitle);
                } else {
                    player.play();
                    console.log("Resumed:", songTitle);
                }
                return;
            }

            // If it's a new song
            currentPlayingTitle = songTitle;
            player.src = filePath;
            player.play().catch(err => {
                console.error("Playback error:", err);
                alert("File not found: " + songTitle + ".mp3");
            });
        }

        async function toggleFavorite(songId, btn) {
            const isCurrentlyFav = btn.textContent.trim() === "❤️";
            const newFavState = !isCurrentlyFav;

            btn.textContent = newFavState ? "❤️" : "🤍";

            try {
                const response = await fetch(`${API_BASE}/${songId}/favorite?isFavorite=${newFavState}`, { method: "PATCH" });
                if (!response.ok) throw new Error("Failed");
            } catch (err) {
                btn.textContent = isCurrentlyFav ? "❤️" : "🤍";
                alert("Could not update favorite.");
            }
        }

        function searchSongs() {
            const type = document.getElementById("search-type").value;
            const query = document.getElementById("search-input").value.trim().toLowerCase();

            fetch(API_BASE)
                .then(res => res.json())
                .then(songs => {
                    const filtered = songs.filter(song => {
                        if (query === "") return true;
                        const val = type === "all"
                            ? (song.title + song.artist + song.genre + song.mood).toLowerCase()
                            : song[type].toLowerCase();
                        return val.includes(query);
                    });
                    displaySongs(filtered);
                });
        }
    </script>
</body>

</html>
