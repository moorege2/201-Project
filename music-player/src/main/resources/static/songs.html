<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Song Library</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            padding: 20px;
        }

        h1 {
            color: #1DB954;
        }

        .search-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-bar input, .search-bar select {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            background-color: #282828;
            color: white;
            font-size: 14px;
        }

        .search-bar button {
            padding: 8px 16px;
            background-color: #1DB954;
            color: black;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .search-bar button:hover {
            background-color: #17a347;
        }

        #song-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .song-card {
            background-color: #282828;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .song-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .song-info {
            padding: 12px;
            text-align: center;
        }

        .song-info h3 {
            margin: 0 0 4px 0;
            font-size: 15px;
            color: #fff;
        }

        .song-info p {
            margin: 3px 0;
            font-size: 13px;
            color: #aaa;
        }

        .no-image {
            width: 100%;
            height: 200px;
            background-color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 13px;
        }

        .fav-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(50, 50, 50, 0.75);
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
            padding: 0;
            z-index: 10;
        }

        .fav-btn:hover {
            transform: scale(1.2);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div style="background:#2a5298;padding:15px;display:flex;
            justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2 style="margin:0;">🎵 Song Library</h2>
        <div>
            <button onclick="window.location.href='home.html'"
                    style="background:white;color:#2a5298;margin-right:8px;">Home</button>
            <button onclick="window.location.href='profile.html'"
                    style="background:white;color:#2a5298;margin-right:8px;">Profile</button>
            <button onclick="logout()"
                    style="background:#e74c3c;color:white;">Logout</button>
        </div>
    </div>

    <script>
        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }
    </script>

    <h1>🎵 Song Library</h1>

    <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search...">
        <select id="search-type">
            <option value="all">All Songs</option>
            <option value="title">By Title</option>
            <option value="artist">By Artist</option>
            <option value="genre">By Genre</option>
            <option value="mood">By Mood</option>
        </select>
        <button onclick="searchSongs()">Search</button>
        <button onclick="loadAllSongs()">Reset</button>
    </div>

    <div id="song-list">Loading songs...</div>

    <script>
        const API_BASE = "http://localhost:8080/api/songs";

        window.onload = loadAllSongs;

        function buildCard(song) {
            return `
                <div class="song-card">
                    <button class="fav-btn ${song.isFavorite ? 'active' : 'inactive'}"
                        onclick="toggleFavorite('${song.id}', this)">
                        ${song.isFavorite ? '❤️' : '🤍'}
                    </button>
                    ${song.imageUrl
                        ? `<img src="${song.imageUrl}" alt="${song.title}">`
                        : `<div class="no-image">No Image</div>`}
                    <div class="song-info">
                        <h3>${song.title}</h3>
                        <p>${song.artist}</p>
                        <p>${song.genre} · ${song.mood}</p>
                        <p>${song.dateReleased}</p>
                    </div>
                </div>
            `;
        }

        function loadAllSongs() {
            fetch(API_BASE)
                .then(res => res.json())
                .then(songs => displaySongs(songs))
                .catch(err => {
                    document.getElementById("song-list").innerHTML = "Failed to load songs.";
                    console.error(err);
                });
        }

        function searchSongs() {
            const type = document.getElementById("search-type").value;
            const query = document.getElementById("search-input").value.trim().toLowerCase();

            if (query === "") {
                loadAllSongs();
                return;
            }

            fetch(API_BASE)
                .then(res => res.json())
                .then(songs => {
                    const filtered = songs.filter(song => {
                        if (type === "all") return (
                            song.title.toLowerCase().includes(query) ||
                            song.artist.toLowerCase().includes(query) ||
                            song.genre.toLowerCase().includes(query) ||
                            song.mood.toLowerCase().includes(query)
                        );
                        if (type === "title")  return song.title.toLowerCase().includes(query);
                        if (type === "artist") return song.artist.toLowerCase().includes(query);
                        if (type === "genre")  return song.genre.toLowerCase().includes(query);
                        if (type === "mood")   return song.mood.toLowerCase().includes(query);
                        return true;
                    });
                    displaySongs(filtered);
                })
                .catch(err => console.error("Search failed:", err));
        }

        function displaySongs(songs) {
            const container = document.getElementById("song-list");
            if (!songs || songs.length === 0) {
                container.innerHTML = "<p>No songs found.</p>";
                return;
            }
            container.innerHTML = songs.map(buildCard).join("");
        }

        async function toggleFavorite(songId, btn) {
            const isCurrentlyFav = btn.classList.contains("active");
            const newFavState = !isCurrentlyFav;

            btn.classList.toggle("active", newFavState);
            btn.classList.toggle("inactive", !newFavState);
            btn.textContent = newFavState ? "❤️" : "🤍";

            try {
                const response = await fetch(`http://localhost:8080/api/songs/${songId}/favorite?isFavorite=${newFavState}`,
                    { method: "PATCH" }
                );
                if (!response.ok) throw new Error("Failed");
            } catch (err) {
                btn.classList.toggle("active", isCurrentlyFav);
                btn.textContent = isCurrentlyFav ? "❤️" : "🤍";
                alert("Could not update favorite. Please try again.");
            }
        }
    </script>

</body>
</html>
